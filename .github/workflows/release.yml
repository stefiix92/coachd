# A pushed tag vX.Y.Z publishes a signed multi-arch image to ghcr.io with an
# SBOM and build provenance, then a GitHub release whose notes are the
# matching CHANGELOG.md section.
# A pre-release tag (vX.Y.Z-rc.N) uses the X.Y.Z section and is published as
# a pre-release.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless signing (Sigstore), via GitHub OIDC
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: Tests (never release a red tree)
        run: go test -race ./...
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          v="${v%%-*}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v" >&2; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # GitHub reports the license as AGPL-3.0; the project is AGPL-3.0-only.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2016 # the backticks are literal Markdown
          {
            printf '\n## Image\n\n`%s@%s`\n\nVerify the signature before you run it:\n\n' "$IMAGE" "$DIGEST"
            printf '```bash\ncosign verify %s@%s \\\n  --certificate-identity-regexp "^https://github.com/%s/.github/workflows/release.yml@refs/tags/v" \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n```\n' "$IMAGE" "$DIGEST" "$GITHUB_REPOSITORY"
          } >> notes.md
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${pre[@]}"
  # The watch app's Connect IQ Store package (the public app, watch/bin/coachd.iq),
  # attached to the release. Only when the CIQ_DEVELOPER_KEY secret (the
  # developer key, base64 of its DER file) is set; it then also needs
  # GARMIN_USERNAME and GARMIN_PASSWORD for the device files.
  watch:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach to the GitHub release
    env:
      HAS_KEY: ${{ secrets.CIQ_DEVELOPER_KEY != '' }}
    steps:
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Store package
        if: env.HAS_KEY == 'true'
        env:
          CIQ_DEVELOPER_KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          CIQ_SDK: ${{ runner.temp }}/ciq-sdk
        run: |
          export PATH="$JAVA_HOME_17_X64/bin:$PATH" # monkeyc runs on Java 17
          watch/ci-setup.sh devices
          watch/ci-setup.sh sdk
          trap 'rm -f .secrets/ciq-developer.der' EXIT
          (umask 077 && mkdir -p .secrets && printf '%s' "$CIQ_DEVELOPER_KEY" | base64 -d > .secrets/ciq-developer.der)
          watch/build.sh store
      - name: Attach to the release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" watch/bin/coachd.iq
